services:
  postgres:
    image: postgres:16-alpine
    container_name: prod_control_db
    environment:
      POSTGRES_DB: production_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: prod_control_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: prod_control_rabbitmq
    ports:
    - "0.0.0.0:5672:5672"
    - "0.0.0.0:15672:15672"

  celery-worker:
    build: .
    container_name: prod_control_celery
    command: celery -A src.celery_app.celery_app worker --loglevel=info --concurrency=4
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL : postgresql+asyncpg://postgres:postgres@postgres:5433/production_control
      PYTHONPATH: /app
    depends_on:
      - rabbitmq
      - redis
      - postgres
    volumes:
      - .:/app
    working_dir: /app

volumes:
  pgdata:
  redis_data:
