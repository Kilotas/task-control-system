services:
  postgres:
    image: postgres:16-alpine
    container_name: prod_control_db
    environment:
      POSTGRES_DB: production_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"        # Mac -> контейнер (из контейнеров НЕ использовать)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d production_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: prod_control_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: prod_control_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: prod_control_api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env.docker
    environment:
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8000:8000"

  celery-worker:
    build: .
    container_name: prod_control_celery
    command: celery -A src.celery_app.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env.docker
    environment:
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app


  celery-beat:
    build: .
    container_name: prod_control_celery_beat
    command: celery -A src.celery_app.celery_app beat --loglevel=info
    env_file:
      - .env.docker
    environment:
      PYTHONPATH: /app
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

  migrate:
    build: .
    command: alembic upgrade head
    env_file:
      - .env.docker
    environment:
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

  minio:
    image: minio/minio:latest
    container_name: prod_control_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 20

  webhook-receiver:
    build:
      context: ./examples
      dockerfile: Dockerfile
    container_name: prod_control_webhook_receiver
    environment:
      WEBHOOK_SECRET: my-secret-key
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  flower:
    build: .
    container_name: prod_control_flower
    command: celery -A src.celery_app.celery_app flower --port=5555
    env_file:
      - .env.docker
    environment:
      PYTHONPATH: /app
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5555:5555"


  postgres-test:
    image: postgres:16-alpine
    container_name: prod_control_db_test
    environment:
      POSTGRES_DB: production_control_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d production_control_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - test

  tests:
    build: .
    container_name: prod_control_tests
    command: python -m pytest -v
    environment:
      PYTHONPATH: /app
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres-test:5432/production_control_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres-test:5432/production_control_test
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123456
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    profiles:
      - test

volumes:
  pgdata:
  redis_data:
  minio_data:
